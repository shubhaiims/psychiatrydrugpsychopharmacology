name: Manual Supabase Drug Seed Import

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "REPLACE_ALL_SUPABASE_DRUGS" to replace public.drugs from server/data/drugs.json'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-supabase-drug-seed-import
  cancel-in-progress: false

jobs:
  replace-drugs:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit replacement confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "REPLACE_ALL_SUPABASE_DRUGS" ]]; then
            echo "::error::Confirmation did not match. No Supabase data was changed."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate app and drug data
        run: npm run build

      - name: Replace Supabase drugs from committed seed
        run: npm run supabase:push
        env:
          CONFIRM_SUPABASE_DRUG_REPLACE: REPLACE_ALL_SUPABASE_DRUGS
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
