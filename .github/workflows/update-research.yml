name: Update Latest Research

# Every third day: refresh public/research.json from PubMed and commit it to the
# default branch, which Vercel deploys automatically.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-research
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch papers from the last six months
        run: node scripts/fetch-research.mjs
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      - name: Check the feed file
        run: node -e 'const d=JSON.parse(require("fs").readFileSync("public/research.json","utf8")); if(!Array.isArray(d.items)) process.exit(1); console.log(d.items.length + " articles")'
      - name: Commit and deploy
        run: |
          if git diff --quiet -- public/research.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add public/research.json
          git commit -m "Update latest research feed"
          git push
