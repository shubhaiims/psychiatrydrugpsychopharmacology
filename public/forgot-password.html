<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Request a Psychiatry Made Easy password reset." />
    <title>Forgot Password | Psychiatry Made Easy</title>
    <link rel="icon" href="/assets/psychiatry-made-easy-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="auth-page" data-auth-page="forgot-password">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Psychiatry Made Easy home">
          <img class="brand-logo" src="/assets/landing/logo-mark-64.png" srcset="/assets/landing/logo-mark-64.png 1x, /assets/landing/logo-mark-128.png 2x" alt="" width="46" height="46" />
          <span><span class="brand-name">Psychiatry Made Easy</span><span class="brand-subtitle">Account recovery</span></span>
        </a>
        <a class="topbar-link" href="/">Home</a>
      </header>
      <main class="auth-page-main">
        <section class="auth-form-shell" aria-labelledby="authHeading">
          <p class="eyebrow">Account recovery</p>
          <h1 id="authHeading">Forgot password</h1>
          <form class="user-auth-form" id="authForm">
            <label for="email"><span>Email</span><input id="email" type="email" autocomplete="email" required /></label>
            <button class="primary-button" type="submit">Send reset link</button>
          </form>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <div class="auth-links"><a href="/login">Back to login</a></div>
        </section>
      </main>
    </div>
    <script src="/auth.js"></script>
  </body>
</html>
