<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Register for the Psychiatry Made Easy drug library." />
    <title>Register | Psychiatry Made Easy</title>
    <link rel="icon" href="/assets/psychiatry-made-easy-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page" data-auth-page="register">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Psychiatry Made Easy home">
          <span class="brand-mark" aria-hidden="true">PME</span>
          <span><span class="brand-name">Psychiatry Made Easy</span><span class="brand-subtitle">Member registration</span></span>
        </a>
        <a class="topbar-link" href="/">Home</a>
      </header>
      <main class="auth-page-main">
        <section class="auth-form-shell" aria-labelledby="authHeading">
          <p class="eyebrow">Drug library</p>
          <h1 id="authHeading">Create account</h1>
          <form class="user-auth-form" id="authForm">
            <label for="fullName"><span>Full name</span><input id="fullName" autocomplete="name" maxlength="120" required /></label>
            <label for="email"><span>Email</span><input id="email" type="email" autocomplete="email" required /></label>
            <label for="password"><span>Password</span><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
            <label for="confirmPassword"><span>Confirm password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
            <button class="primary-button" type="submit">Register</button>
          </form>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <div class="auth-links"><a href="/login">Already registered? User Login</a></div>
        </section>
      </main>
    </div>
    <script src="/auth.js"></script>
  </body>
</html>
