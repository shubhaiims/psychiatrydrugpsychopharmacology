<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Search | Psychiatry Made Easy</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/search.css">
  <link rel="stylesheet" href="/typography.css" />
  <script type="module" src="/search.js"></script>
</head>
<body class="search-page">
  <header class="search-header">
    <a class="brand" href="/"><img src="/assets/landing/logo-mark-64.png" width="40" height="40" alt=""><span>Psychiatry <em>Made Easy</em></span></a>
    <nav aria-label="Main navigation"><a href="/">Home</a><a href="/browse">Drug library</a></nav>
  </header>
  <main>
    <h1>Search results</h1>
    <form action="/search" method="get" role="search">
      <input id="query" name="q" type="search" placeholder="Search anything" aria-label="Search anything" required maxlength="200">
      <button type="submit" aria-label="Search" title="Search">
        <!-- Lucide Search icon (ISC license). -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </form>
    <p id="status" role="status" aria-live="polite">Loading search results...</p>
    <p id="notice" hidden></p>
    <ol id="results" aria-label="Matching sections"></ol>
  </main>
</body>
</html>
