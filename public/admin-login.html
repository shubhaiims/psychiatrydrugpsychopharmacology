<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Authorized administrator login for Psychiatry Made Easy." />
    <title>Admin Login | Psychiatry Made Easy</title>
    <link rel="icon" href="/assets/psychiatry-made-easy-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/typography.css" />
  </head>
  <body class="auth-page admin-page" data-auth-page="admin-login">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Psychiatry Made Easy home">
          <img class="brand-logo" src="/assets/landing/logo-mark-64.png" srcset="/assets/landing/logo-mark-64.png 1x, /assets/landing/logo-mark-128.png 2x" alt="" width="46" height="46" />
          <span><span class="brand-name">Psychiatry Made Easy</span><span class="brand-subtitle">Admin authentication</span></span>
        </a>
        <a class="topbar-link" href="/">Home</a>
      </header>
      <main class="auth-page-main">
        <section class="auth-form-shell admin-auth-shell" aria-labelledby="authHeading">
          <p class="eyebrow">Restricted access</p>
          <h1 id="authHeading">Admin login</h1>
          <form class="user-auth-form" id="authForm">
            <label for="email"><span>Admin email</span><input id="email" type="email" autocomplete="email" required /></label>
            <label for="password"><span>Password</span><input id="password" type="password" autocomplete="current-password" required /></label>
            <button class="primary-button" type="submit">Open admin editor</button>
          </form>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <div class="auth-links"><a href="/forgot-password">Forgot password?</a><a href="/login">Member login</a></div>
        </section>
      </main>
    </div>
    <script src="/auth.js"></script>
  </body>
</html>
