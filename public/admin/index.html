<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Psychiatry Made Easy admin editor." />
    <title>Psychiatry Made Easy Admin</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="admin-page">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Psychiatry Made Easy home">
          <img src="../logo.png" alt="Psychiatry Made Easy" class="brand-logo" />
          <div class="brand-text">
            <span style="font-size: 0.92rem; font-weight: 700; color: var(--ink);">Psychiatry Made Easy</span>
            <span style="font-size: 0.75rem; color: var(--muted);">Admin editor</span>
          </div>
        </a>
        <a class="topbar-link" href="/dashboard">View Drug Dashboard</a>
      </header>

      <main>
        <section class="editor-layout" id="editorView" aria-label="Drug editor">
          <aside class="editor-sidebar">
            <form class="auth-panel" id="loginForm">
              <label for="adminPassword">
                <span>Admin password</span>
                <input id="adminPassword" type="password" autocomplete="current-password" />
              </label>
              <div class="editor-actions">
                <button class="primary-button" type="submit" id="loginButton">Unlock editor</button>
                <button class="secondary-button" type="button" id="logoutButton">Lock</button>
              </div>
            </form>

            <div class="editor-actions">
              <button class="primary-button" type="button" id="newDrugButton">New drug</button>
              <button class="secondary-button" type="button" id="duplicateDrugButton">Duplicate</button>
            </div>

            <label class="select-block" for="editorDrugSelect">
              <span>Current record</span>
              <select id="editorDrugSelect"></select>
            </label>

            <div class="data-actions">
              <button class="secondary-button" type="button" id="exportJsonButton">Export JSON</button>
              <button class="secondary-button" type="button" id="copyJsonButton">Copy JSON</button>
              <label class="file-button" for="importJsonInput">Import JSON</label>
              <input id="importJsonInput" type="file" accept="application/json,.json" />
              <button class="danger-button" type="button" id="clearDataButton">Clear all records</button>
            </div>

            <p class="editor-status" id="editorStatus" role="status" aria-live="polite">Connect to the backend to begin.</p>
          </aside>

          <form class="editor-form" id="drugForm">
            <input type="hidden" id="editDrugId" />
            <div class="form-header">
              <div>
                <p class="eyebrow">Drug record</p>
                <h1 id="editorHeading">Create drug</h1>
              </div>
              <div class="form-header-actions">
                <button class="danger-button" type="button" id="deleteDrugButton">Delete</button>
                <button class="primary-button" type="submit" id="saveDrugButton">Save changes</button>
              </div>
            </div>

            <div class="form-grid">
              <label>
                <span>Generic name</span>
                <input id="fieldName" required />
              </label>
              <label>
                <span>Brand names</span>
                <input id="fieldBrands" placeholder="Separate with commas" />
              </label>
              <label>
                <span>Medication group</span>
                <select id="fieldMedicationGroup"></select>
              </label>
              <label>
                <span>Classification</span>
                <input id="fieldClassification" required />
              </label>
              <label>
                <span>Monitoring intensity</span>
                <select id="fieldRisk">
                  <option value="standard">Standard</option>
                  <option value="watch">Watch</option>
                  <option value="high">High</option>
                </select>
              </label>
              <label>
                <span>Target dose</span>
                <input id="fieldTargetDose" placeholder="Example: 10-20 mg/day" />
              </label>
              <label>
                <span>Maximum dose</span>
                <input id="fieldMaximumDose" placeholder="Example: 40 mg/day" />
              </label>
              <label>
                <span>Last reviewed</span>
                <input id="fieldReviewed" type="date" />
              </label>
            </div>

            <div class="form-grid two-column">
              <label>
                <span>Mechanism of Action and Receptor Profile</span>
                <textarea id="fieldMechanismOfActionAndReceptorProfile" rows="5"></textarea>
              </label>
              <label>
                <span>Pharmacodynamics</span>
                <textarea id="fieldPharmacodynamics" rows="5"></textarea>
              </label>
              <label>
                <span>FDA Approved and Off-Label Uses</span>
                <textarea id="fieldFdaApprovedAndOffLabelUses" rows="5"></textarea>
              </label>
              <label>
                <span>Pharmacokinetics and Half-Life</span>
                <textarea id="fieldPharmacokineticsAndHalfLife" rows="5"></textarea>
              </label>
            </div>

            <div class="form-grid two-column">
              <label>
                <span>Clinical Dosing, Optimization, and Target Dose</span>
                <textarea id="fieldClinicalDosingOptimizationAndTargetDose" rows="5"></textarea>
              </label>
              <label>
                <span>Side Effects</span>
                <textarea id="fieldSideEffects" rows="5"></textarea>
              </label>
              <label>
                <span>FDA black box warning</span>
                <textarea id="fieldFdaBlackBoxWarning" rows="5"></textarea>
              </label>
              <label>
                <span>Prescribing in Special Populations</span>
                <textarea id="fieldPrescribingInSpecialPopulations" rows="5"></textarea>
              </label>
              <label>
                <span>Drug interactions</span>
                <textarea id="fieldDrugInteractions" rows="5"></textarea>
              </label>
              <label>
                <span>Miscellaneous</span>
                <textarea id="fieldMiscellaneous" rows="5"></textarea>
              </label>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="../admin.js"></script>
  </body>
</html>
