<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Set a new Psychiatry Made Easy password." />
    <title>Reset Password | Psychiatry Made Easy</title>
    <link rel="icon" href="/assets/psychiatry-made-easy-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-page" data-auth-page="reset-password">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Psychiatry Made Easy home">
          <span class="brand-mark" aria-hidden="true">PME</span>
          <span><span class="brand-name">Psychiatry Made Easy</span><span class="brand-subtitle">Account recovery</span></span>
        </a>
        <a class="topbar-link" href="/">Home</a>
      </header>
      <main class="auth-page-main">
        <section class="auth-form-shell" aria-labelledby="authHeading">
          <p class="eyebrow">Account recovery</p>
          <h1 id="authHeading">Reset password</h1>
          <form class="user-auth-form is-hidden" id="authForm">
            <label for="password"><span>New password</span><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
            <label for="confirmPassword"><span>Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required /></label>
            <button class="primary-button" type="submit">Update password</button>
          </form>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
          <div class="auth-links"><a href="/forgot-password">Request another reset link</a></div>
        </section>
      </main>
    </div>
    <script src="/auth.js"></script>
  </body>
</html>
