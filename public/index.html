<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Psychiatry Made Easy psychopharmacology drug dashboard."
    />
    <title>Psychiatry Made Easy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#library" aria-label="Psychiatry Made Easy home">
          <span class="brand-mark" aria-hidden="true">PME</span>
          <span>
            <span class="brand-name">Psychiatry Made Easy</span>
            <span class="brand-subtitle">Psychopharmacology dashboard</span>
          </span>
        </a>
      </header>

      <main>
        <section class="workspace" id="libraryView">
          <aside class="library-panel" aria-label="Drug library">
            <div class="toolbar">
              <label class="select-block" for="medicationGroupSelect">
                <span>Medication group</span>
                <select id="medicationGroupSelect"></select>
              </label>

              <label class="select-block" for="drugNameSelect">
                <span>Choose drug</span>
                <select id="drugNameSelect"></select>
              </label>

              <label class="select-block" for="outlineSelect">
                <span>Drug outline</span>
                <select id="outlineSelect"></select>
              </label>
            </div>

          </aside>

          <section class="detail-panel" id="drugDetail" aria-live="polite"></section>
        </section>

      </main>

      <footer class="site-footer">
        Educational reference scaffold. Verify all drug information against current prescribing information, local protocols, and clinical judgment.
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
