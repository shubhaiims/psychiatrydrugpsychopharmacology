<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Psychiatry Made Easy psychopharmacology drug dashboard."
    />
    <title>Psychiatry Made Easy</title>
    <link rel="icon" href="assets/psychiatry-made-easy-logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-masthead" id="home">
        <nav class="masthead-nav" aria-label="Primary navigation">
          <div class="nav-group">
            <a class="nav-link" href="#home">Home</a>
            <a class="nav-link nav-link-caret" href="#libraryView">Psychiatry Drugs</a>
          </div>

          <a class="masthead-brand" href="#libraryView" aria-label="Psychiatry Made Easy dashboard">
            <img src="assets/psychiatry-made-easy-logo.png" alt="" />
            <span>Psychiatry Made Easy</span>
          </a>

          <div class="nav-group nav-group-right">
            <a class="nav-link" href="/admin/">Login</a>
            <span class="user-glyph" aria-hidden="true"></span>
          </div>
        </nav>

        <div class="hero-stage" aria-label="Psychiatry Made Easy">
          <div class="hero-visual" aria-hidden="true">
            <img src="assets/psychiatry-made-easy-logo.png" alt="" />
          </div>
          <div class="hero-copy">
            <h1>Psychiatry Made Easy</h1>
            <p>Master the mind</p>
            <a class="hero-button" href="#libraryView">Open drug library</a>
          </div>
        </div>
      </header>

      <main>
        <section class="workspace" id="libraryView">
          <aside class="library-panel" aria-label="Drug library">
            <div class="toolbar">
              <label class="select-block" for="medicationGroupSelect">
                <span>Medication group</span>
                <select id="medicationGroupSelect"></select>
              </label>

              <label class="select-block" for="drugNameSelect">
                <span>Choose drug</span>
                <select id="drugNameSelect"></select>
              </label>

              <label class="select-block" for="outlineSelect">
                <span>Drug outline</span>
                <select id="outlineSelect"></select>
              </label>
            </div>

          </aside>

          <section class="detail-panel" id="drugDetail" aria-live="polite"></section>
        </section>

      </main>

      <footer class="site-footer">
        Educational reference scaffold. Verify all drug information against current prescribing information, local protocols, and clinical judgment.
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
